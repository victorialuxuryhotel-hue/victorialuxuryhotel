play:flex;justify-content:space-between;font-size:14px"><span style="color:#5b6372">Deluxe · 2 nights</span><span style="font-weight:600">₦260,000</span></div><div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:#5b6372">Breakfast</span><span style="font-weight:600">₦30,000</span></div><div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #e4e0d6;padding-top:12px"><span style="font-size:15px">Total</span><b style="font-size:26px">₦290,000</b></div><button type="button" style="font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;background:#021c6c;color:#fff;border:1px solid #021c6c;height:60px;padding:0 24px;font-size:18px;font-weight:600;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:fit-content;flex:none;white-space:nowrap;width:100%">Continue to payment</button><div style="display:flex;justify-content:center"><button type="button" style="font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;background:transparent;color:#0430a0;border:1px solid transparent;height:36px;padding:0 12px;font-size:14px;font-weight:600;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:fit-content;flex:none;white-space:nowrap;">← Back to rooms</button></div></aside></div></section></div>
